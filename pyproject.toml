[project]
name = "rag-stackoverflow"
version = "0.1.0"
description = "RAG system over Stack Overflow Python Q&A"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.32.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "rank-bm25>=0.2.2",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "anthropic>=0.25.0",
    "kaggle>=1.7.4.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
